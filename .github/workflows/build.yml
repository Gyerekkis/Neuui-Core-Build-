name: NeuUI Core Auto-Builder

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Kod letoltese
      uses: actions/checkout@v4

    - name: Tarhely es Csomagok Elokeszitese
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
        export DEBIAN_FRONTEND=noninteractive
        sudo dpkg --add-architecture i386
        sudo apt-get update -y || true
        sudo apt-get install -y --no-install-recommends \
          bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf \
          libncurses5-dev libncursesw5-dev libgl1-mesa-dev libxml2-utils xsltproc zip zlib1g-dev

    - name: Android Repo telepitese
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH

    - name: NeuUI & LineageOS Forraskod szinkronizalasa
      run: |
        export PATH=$HOME/bin:$PATH
        mkdir -p ~/neuui && cd ~/neuui
        repo init -u https://github.com/LineageOS/android.git -b lineage-20.0 --git-lfs --depth=1
        
        if [ -f $GITHUB_WORKSPACE/.repo/local_manifests/neuui.xml ]; then
          mkdir -p .repo/local_manifests
          cp $GITHUB_WORKSPACE/.repo/local_manifests/neuui.xml .repo/local_manifests/
        fi
        
        repo sync -c --no-clone-bundle --no-tags -j8

    - name: NeuUI Core (Android Go) Modositasok
      run: |
        cd ~/neuui
        if [ -d "device/samsung/a10" ]; then
          echo "PRODUCT_PROPERTY_OVERRIDES += ro.config.low_ram=true" >> device/samsung/a10/lineage_a10.mk
          echo "PRODUCT_PROPERTY_OVERRIDES += ro.neuui.version=1.0.0-Core" >> device/samsung/a10/lineage_a10.mk
        fi

    - name: ROM Forditas
      run: |
        export PATH=$HOME/bin:$PATH
        cd ~/neuui
        source build/envsetup.sh
        lunch lineage_a10-userdebug || true
        mka bacon -j$(nproc --all) || true

    - name: Kesz ROM letoltese
      uses: actions/upload-artifact@v4
      with:
        name: NeuUI-Core-GalaxyA10
        path: ~/neuui/out/target/product/a10/*.zip
