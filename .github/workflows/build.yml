name: NeuUI Core Auto-Builder

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Kod letoltese
      uses: actions/checkout@v3

    - name: Felhos kornyezet elokeszitese
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32ncurses5-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc zip zlib1g-dev

    - name: Android Repo eszkoz telepitese
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        export PATH=~/bin:$PATH

    - name: NeuUI & LineageOS Forraskod szinkronizalasa
      run: |
        mkdir -p ~/neuui && cd ~/neuui
        ~/bin/repo init -u https://github.com/LineageOS/android.git -b lineage-20.0 --git-lfs --depth=1
        
        # Manifest fajl bemasolasa
        if [ -f $GITHUB_WORKSPACE/.repo/local_manifests/neuui.xml ]; then
          mkdir -p .repo/local_manifests
          cp $GITHUB_WORKSPACE/.repo/local_manifests/neuui.xml .repo/local_manifests/
        fi
        
        ~/bin/repo sync -c --no-clone-bundle --no-tags -j8

    - name: NeuUI Core (Android Go) Modositasok
      run: |
        cd ~/neuui
        # Go Edition low-ram mod kenoyszeritese
        if [ -d "device/samsung/a10" ]; then
          echo "PRODUCT_PROPERTY_OVERRIDES += ro.config.low_ram=true" >> device/samsung/a10/lineage_a10.mk
          echo "PRODUCT_PROPERTY_OVERRIDES += ro.neuui.version=1.0.0-Core" >> device/samsung/a10/lineage_a10.mk
        fi

    - name: ROM Forditas
      run: |
        cd ~/neuui
        source build/envsetup.sh
        lunch lineage_a10-userdebug || true
        mka bacon -j$(nproc --all) || true

    - name: Kesz ROM letoltese
      uses: actions/upload-artifact@v3
      with:
        name: NeuUI-Core-GalaxyA10
        path: ~/neuui/out/target/product/a10/*.zip
